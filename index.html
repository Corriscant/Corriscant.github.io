<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corriscant Games</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: #171717;
      color: #f2f2f2;
    }

    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 40px;
      color: #b8b8b8;
    }

    .game-card {
      padding: 24px;
      border: 1px solid #3b3b3b;
      border-radius: 12px;
      background: #202020;
    }

    .game-card h2 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .game-card p {
      margin: 0 0 20px;
      color: #c9c9c9;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .button {
      display: inline-block;
      padding: 10px 15px;
      border: 1px solid #666;
      border-radius: 7px;
      color: #fff;
      text-decoration: none;
      background: #303030;
    }

    .button:hover {
      background: #3a3a3a;
    }

    .pixelpicked {
      display: inline-block;
      line-height: 0;
    }

    footer {
      margin-top: 38px;
      padding-top: 22px;
      border-top: 1px solid #333;
      color: #aaa;
      font-size: 14px;
    }

    footer a {
      color: #cfcfcf;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    footer ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 14px 20px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Corriscant Games</h1>
    <p class="subtitle">Independent game development.</p>

    <section class="game-card">
      <h2>Minesweeper: Level Rush</h2>
      <p>Classic Minesweeper with Level Rush, Daily Challenges, and multiple ways to play.</p>

      <div class="actions">
        <a class="button" href="/minesweeper-level-rush/">Play in Browser</a>
        <a class="button" href="https://play.google.com/store/apps/details?id=com.corriscant.minesweeper" target="_blank" rel="noopener">Google Play</a>
      </div>

      <a class="pixelpicked" href="https://pixelpicked.com/game/4neaS2Jr6Ur/minesweeper-level-rush/" target="_blank" rel="noopener">
        <img src="https://api.pixelpicked.com/api/badges/4neaS2Jr6Ur/live.png?theme=dark"
             width="250" height="54" alt="Approved on PixelPicked" />
      </a>
    </section>

    <footer>
      <ul>
        <li><a href="privacy-policy.html">Privacy Policy</a></li>
        <li><a href="third-party-notices.html">Third-party licenses</a></li>
        <li><a href="app-ads.txt">app-ads.txt</a></li>
      </ul>
    </footer>
  </main>
</body>
</html>
